name: GitHub-Profile-3D-Contrib

on:
  # Daily scheduled update (18:00 UTC == 00:00 Asia/Dhaka)
  schedule:
    - cron: "0 18 * * *"
  # Manual trigger from GitHub Actions
  workflow_dispatch:
  # Run on push when workflow itself is modified
  push:
    branches:
      - main
    paths:
      - ".github/workflows/profile-3d.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-3d-contrib
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate 3D Contribution Calendar
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN }}
          USERNAME: mohammadrony

      - name: Commit and Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A profile-3d-contrib
          if git commit -m "chore: update 3d contribution calendar [skip ci]"; then
            git push
          fi
